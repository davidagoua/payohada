name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Tests backend (moteur de paie + API)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Vérifier la compilation
        run: python -m compileall -q app

      - name: Lancer les tests
        env:
          # Les tests configurent eux-mêmes une base SQLite jetable.
          SUPABASE_JWT_SECRET: secret-de-ci-uniquement
        run: python -m unittest discover -s tests -t . -v

  frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Installer les dépendances
        run: bun install --frozen-lockfile

      - name: Tests de la logique de navigation par rôle
        run: node scripts/test-auth-navigation.mjs

      - name: Build (typecheck via vue-tsc inclus dans nuxt build)
        env:
          NUXT_PUBLIC_API_BASE: http://localhost:8000/api/v1
        run: bun run build

  secrets:
    name: Détection de secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
